name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - name: Unit tests
        run: cargo test -- --skip cputest
      - name: Build wasm
        run: wasm-pack build --release --target web --out-dir web/pkg
      # Тест-ROM gilyon/snes-tests через собранный wasm: в логе все упавшие тесты.
      - name: CPU test ROMs
        run: |
          node tools/cputest.mjs tests/data/cputest-basic.sfc tests/data/cputest-basic.txt
          node tools/cputest.mjs tests/data/cputest-full.sfc tests/data/cputest-full.txt
      - name: SPC700 test ROM
        run: node tools/spctest.mjs tests/data/spctest.sfc tests/data/spctest.txt
      - name: DSP audio (end-to-end)
        run: node tools/audiotest.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
